services:
  - type: web
    name: lumen-backend
    runtime: python
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MODEL_PATH
        sync: false
      - key: FRONTEND_URL
        sync: false
